<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Estação Meteorológica - rcsdnj</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="container">
    <header class="page-header">
      <div>
        <h1>Estação Meteorológica</h1>
        <p class="subtitle">Leituras atuais e resumo das últimas horas</p>
      </div>
      <div class="weather-badge">⛅ Estação online</div>
    </header>

    <section class="current-grid">
      <div class="metric-card metric-card-wind">
        <div class="metric-top">
          <div class="metric-icon" aria-hidden="true">🌬️</div>
          <div class="metric-label">Velocidade do vento</div>
        </div>
        <div class="metric-value-row">
          <span id="vel" class="metric-value">--</span>
          <span id="unidade" class="metric-unit">km/h</span>
        </div>
      </div>

      <div class="metric-card metric-card-temp">
        <div class="metric-top">
          <div class="metric-icon" aria-hidden="true">🌡️</div>
          <div class="metric-label">Temperatura</div>
        </div>
        <div class="metric-value-row">
          <span id="temp" class="metric-value">--</span>
          <span class="metric-unit">°C</span>
        </div>
      </div>

      <div class="metric-card metric-card-hum">
        <div class="metric-top">
          <div class="metric-icon" aria-hidden="true">💧</div>
          <div class="metric-label">Humidade</div>
        </div>
        <div class="metric-value-row">
          <span id="hum" class="metric-value">--</span>
          <span class="metric-unit">%</span>
        </div>
      </div>
    </section>

    <section class="panel controls-panel">
      <div class="controls-header">
        <h2>Preferências</h2>
      </div>

      <div class="controls-row">
        <div class="unit-selector">
          <span class="control-label">Unidade do vento:</span>
          <label class="radio-pill">
            <input type="radio" name="unidade" value="kmh" checked>
            <span>km/h</span>
          </label>
          <label class="radio-pill">
            <input type="radio" name="unidade" value="ms">
            <span>m/s</span>
          </label>
        </div>
      </div>

      <p class="stale" id="stale">⚠ Dados desatualizados</p>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Resumo meteorológico</h2>
        <p>Máximos, médias e mínimos por janela de tempo</p>
      </div>

      <div class="stats-cards" id="stats-cards">
        <div class="stats-card">
          <div class="stats-card-header">
            <h3>Carregando...</h3>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="index.js"></script>
</body>
</html>
